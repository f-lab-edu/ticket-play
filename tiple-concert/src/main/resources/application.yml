
# ?? ??
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/tiple?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:tiple}
    password: ${SPRING_DATASOURCE_PASSWORD:0000}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 40  # ??? 10?? ??
      connection-timeout: 30000  # 30?(???)
      max-lifetime: 1800000  # 30?
      idle-timeout: 600000  # 10?
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true # Hibernate? ???? SQL ??? ??? ?? ?? ??? ???
    management:
      endpoints:
        web:
          exposure:
            include: "prometheus"
      tracing:
        sampling:
          probability: 1.0
      zipkin:
        tracing:
          endpoint: http://tempo:9411/api/v2/spans
      metrics:
        distribution:
          percentiles-histogram:
            http:
              server:
                requests: true
  sql:
    init:
      mode: always
      schema-locations: classpath:data/schema.sql
      data-locations: classpath:data/data.sql
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      # Redisson ?? ?? ??
      redisson:
        config:
          # ?? ??
          single-server-config:
            connection-minimum-idle-size: ${REDIS_MIN_IDLE_SIZE:8}        # ?? ?? ?
            connection-pool-size: ${REDIS_POOL_SIZE:24}                   # ?? ? ??
            retry-attempts: ${REDIS_RETRY_ATTEMPTS:3}                     # ??? ??
            retry-interval: ${REDIS_RETRY_INTERVAL:1500}                  # ??? ??(ms)
            subscriptions-per-connection: ${REDIS_SUBS_PER_CONN:5}        # ??? ?? ?
            subscription-connection-pool-size: ${REDIS_SUB_POOL_SIZE:50}  # ?? ?? ? ??
            timeout: ${REDIS_TIMEOUT:3000}                                # ????(ms)
      # Jedis ?? (??)
      jedis:
        pool:
          max-active: 8
      connect-timeout: 20
  retryable:
    maxAttempts: 3
    backoff:
      delay: 1000
      multiplier: 2
  task:
    timeout:
      executor:
        core_pool_size: 5
        max_pool_size: 5
        queue_capacity: 200
        keep_alive_seconds: 60
        thread_name_prefix: timeout-
        await_termination_seconds: 30
    event:
      executor:
        core_pool_size: 5
        max_pool_size: 5
        queue_capacity: 200
        thread_name_prefix: event-


server:
  port: ${PORT:8083}
  forward-headers-strategy: native # ??? ?? ??? ??? ???? ??
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
      force-request: true
      force-response: true
  tomcat:
    uri-encoding: UTF-8

logging:
  level:
    org.apache.kafka.clients: WARN
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    org.hibernate.resource.transaction: debug
    org.springframework.transaction: debug
    org.springframework.orm.jpa: debug
    root: info
    org.apache.kafka: DEBUG
    org.springframework.kafka: DEBUG
    com.example.ticketing: DEBUG
  #  pattern:
  #    console: " [${spring.application.name:}] | %logger{36} | %X{method} %X{path} | totalTime=%X{totalTime:-0ms} lockTime=%X{lockTime:-0ms} firstLockTime=%X{firstLockTime:-none} secondLockTime=%X{secondLockTime:-0}| %msg%n"
  #    file: "[${spring.application.name:}] | %logger{36} | %X{method} %X{path} | totalTime=%X{totalTime:-0ms} lockTime=%X{lockTime:-0ms} firstLockTime=%X{firstLockTime:-none} secondLockTime=%X{secondLockTime:-0} | %msg%n"
  file:
    name: /logs/ticket-service.log


jwt:
  secret: ${JWT_SECRET:default_dev_secret_key}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

