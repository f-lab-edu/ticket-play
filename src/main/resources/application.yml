# 공통 설정
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    properties:
      hibernate:
        format_sql: false # Hibernate가 생성하는 SQL 쿼리를 사람이 읽기 쉬운 형태로 포맷팅
        show_sql: false
management:
  endpoints:
    web:
      exposure:
        include: "prometheus"
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://tempo:9411/api/v2/spans
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: native # 서버가 요청 헤더를 어떻게 처리할지 지정
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
      force-request: true
      force-response: true
  tomcat:
    uri-encoding: UTF-8

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    org.hibernate.resource.transaction: debug
    org.springframework.transaction: debug
    org.springframework.orm.jpa: debug
    root: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} | %5p | [${spring.application.name:},%X{trace_id:-},%X{span_id:-}] | %logger{36} | %X{method} %X{path} | totalTime=%X{totalTime:-0ms} lockTime=%X{lockTime:-0ms} stepInfo=%X{stepInfo:-none} retryCount=%X{retryCount:-0} errorType=%X{errorType:-none} | %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} | %5p | [${spring.application.name:},%X{trace_id:-},%X{span_id:-}] | %logger{36} | %X{method} %X{path} | totalTime=%X{totalTime:-0ms} lockTime=%X{lockTime:-0ms} stepInfo=%X{stepInfo:-none} retryCount=%X{retryCount:-0} errorType=%X{errorType:-none} | %msg%n"
  file:
    name: /logs/ticket-service.log



jwt:
  secret: ${JWT_SECRET:default_dev_secret_key}
  expiration-ms: 86400000

---
# 로컬 개발 환경 (H2 데이터베이스 사용)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:tcp://localhost/~/tiple
    username: sa
    password:
    driver-class-name: org.h2.Driver
    datasource:
      hikari:
        maximum-pool-size: 20         # 기본값보다 증가
        minimum-idle: 5               # 유지할 최소 연결 수
        connection-timeout: 30000     # 연결 타임아웃(ms)
        idle-timeout: 600000          # 유휴 연결 타임아웃(ms)
        max-lifetime: 1800000         # 연결 최대 수명(ms)
  jpa:
    hibernate:
      ddl-auto: none  # JPA에 의한 테이블 자동 생성 비활성화
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:data/schema.sql
      data-locations: classpath:data/data.sql

---
# Docker 환경 (MySQL 데이터베이스 사용)
spring:
  config:
    activate:
      on-profile: local-docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/tiple?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:tiple}
    password: ${SPRING_DATASOURCE_PASSWORD:0000}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:data/schema.sql
      data-locations: classpath:data/data.sql