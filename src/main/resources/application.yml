# 공통 설정
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    properties:
      hibernate:
        format_sql: false # Hibernate가 생성하는 SQL 쿼리를 사람이 읽기 쉬운 형태로 포맷팅
        show_sql: false
management:
  endpoints:
    web:
      exposure:
        include: "prometheus"
server:
  port: ${PORT:8080}
  forward-headers-strategy: native # 서버가 요청 헤더를 어떻게 처리할지 지정
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
      force-request: true
      force-response: true
  tomcat:
    uri-encoding: UTF-8

logging.level:
  org.hibernate.SQL: off
  org.hibernate.type: off
  root: info

jwt:
  secret: ${JWT_SECRET:default_dev_secret_key}
  expiration-ms: 86400000

---
# 로컬 개발 환경 (H2 데이터베이스 사용)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:tcp://localhost/~/tiple
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none  # JPA에 의한 테이블 자동 생성 비활성화
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:data/schema.sql
      data-locations: classpath:data/data.sql

---
# Docker 환경 (MySQL 데이터베이스 사용)
spring:
  config:
    activate:
      on-profile: local-docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/tiple?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:tiple}
    password: ${SPRING_DATASOURCE_PASSWORD:0000}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:data/schema.sql
      data-locations: classpath:data/data.sql