  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    # 볼륨을 제거하고 설정을 변경하여 데이터 지속성 비활성화
    command: redis-server --save "" --appendonly no
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: spring-server
    volumes:
      - ./logs:/logs
    # Dockerfile기반으로 build
    build:
      context: .
      dockerfile: Dockerfile
    # 환경변수 설정 - 인코딩 설정 추가
    environment:
      - SPRING_PROFILES_ACTIVE=local-docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tiple?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=tiple
      - SPRING_DATASOURCE_PASSWORD=0000
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_OPTS=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
      - SERVER_PORT=8083
      # Redis 연결 설정 추가
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    ports:
      - "8083:8083"
    # mysql이 제대로 실행되면 실행
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
#      kafka:
#        condition: service_healthy
    networks:
      - app-network

  server2:
    container_name: spring-server2
    volumes:
      - ./logs:/logs
    # Dockerfile기반으로 build
    build:
      context: .
      dockerfile: Dockerfile
    # 환경변수 설정 - 인코딩 설정 추가
    environment:
      - SPRING_PROFILES_ACTIVE=local-docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tiple?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=tiple
      - SPRING_DATASOURCE_PASSWORD=0000
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_OPTS=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
      - SERVER_PORT=8084
      # Redis 연결 설정 추가
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    ports:
      - "8084:8084"
    # mysql이 제대로 실행되면 실행
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
#      kafka:
#        condition: service_healthy
    networks:
      - app-network

  server3:
    container_name: spring-server3
    volumes:
      - ./logs:/logs
    # Dockerfile기반으로 build
    build:
      context: .
      dockerfile: Dockerfile
    # 환경변수 설정 - 인코딩 설정 추가
    environment:
      - SPRING_PROFILES_ACTIVE=local-docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tiple?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=tiple
      - SPRING_DATASOURCE_PASSWORD=0000
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_OPTS=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
      - SERVER_PORT=8085
      # Redis 연결 설정 추가
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    ports:
      - "8085:8085"
    # mysql이 제대로 실행되면 실행
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
#      kafka:
#        condition: service_healthy
    networks:
      - app-network

  # MySQL 서비스
  mysql:
    image: mysql:8.0.32
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: tiple
      MYSQL_USER: tiple
      MYSQL_PASSWORD: 0000
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # - mysql-data:/var/lib/mysql # MySQL 데이터 유지 (mysql-data) → 컨테이너가 재시작되어도 데이터 유지됨.
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/config:/etc/mysql/conf.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p0000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Nginx 서비스
  nginx:
    image: nginx:latest
    container_name: nginx-server
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

# Redis 볼륨을 제거하여 컨테이너 재시작 시 데이터가 유지되지 않도록 함
