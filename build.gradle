plugins {
	id 'java'
	id 'jacoco' //jacoco설정
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '3.3.2' // rest-docs설정
}

group = 'com.flab.tiple'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jacoco {
	toolVersion = "0.8.9"
	reportsDirectory = layout.buildDirectory.dir("reports/jacoco")
}

configurations {
	asciidoctorExtensions // Asciidoctor 플러그인을 위한 설정. Spring REST Docs에서 Asciidoctor를 사용할 때 필요함.
	compileOnly {
		//annotationProcessor 설정을 compileOnly에도 적용.
		//Lombok 등의 어노테이션 프로세서를 사용할 때 필요.
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'

	//test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	//rest-docs
	asciidoctorExtensions 'org.springframework.restdocs:spring-restdocs-asciidoctor'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

	//spring-security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'

	//jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	//aop
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// QueryDSL 의존성
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// 스프링 swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
	// SpringDoc과 호환되는 Spring Web 버전으로 명시
	implementation 'org.springframework:spring-web:6.1.5'
	implementation 'org.springframework:spring-webmvc:6.1.5'

	//mysql 커넥터 추가
	implementation 'mysql:mysql-connector-java:8.0.32'
}

//ext {} 블록 (전역 변수 설정)
ext {
	// 아래서 사용할 변수 선언
	snippetsDir = file('build/generated-snippets')
}

// QueryDSL 설정
def querydslDir = "src/main/generated/querydsl"

sourceSets {
	main {
		java {
			srcDirs = ['src/main/java']  // 기본 소스 디렉토리 명시적 설정
			srcDirs += [querydslDir]
		}
	}
	test {
		java {
			srcDirs = ['src/test/java']
		}
	}
}

// 통합된 test 블록 (이전에 중복되어 있던 것을 하나로 통합)
test {
	outputs.dir snippetsDir
	useJUnitPlatform()
	finalizedBy jacocoTestReport // 테스트 후 JaCoCo 리포트 생성
}

//JaCoCo 설정
jacocoTestReport {
	reports {
		xml.required = true //xml.required = true → XML 리포트 생성 (PR에서 커버리지 체크할 때 사용)
		csv.required = false //csv.required = false → CSV 리포트는 필요 없음
		html.required = true //HTML 리포트 생성 (개발자가 보기 편하게)
	}
}

// asciidoctor 설정(Spring REST Docs 관련 설정)
asciidoctor {
	dependsOn test //테스트 실행 후에 실행됨. ->Spring REST Docs의 문서 조각이 테스트 실행 후 생성되기 때문
	configurations 'asciidoctorExtensions'
	inputs.dir snippetsDir //build/generated-snippets 디렉토리를 문서 입력값으로 사용

	//문서에 포함할 .adoc 파일 지정 -> index.adoc만 포함.
	sources{
		include("**/index.adoc")
	}

	baseDirFollowsSourceFile()

	// 문서 내부에서 사용할 속성 정의
	attributes 'snippets': snippetsDir,
			'operation-curl-request-title': 'Example request',
			'operation-http-response-title': 'Example response'
}

// REST Docs 폴더 초기화
asciidoctor.doFirst {
	//REST Docs를 다시 만들기 전에 기존 static/docs 폴더 삭제.
	delete file('src/main/resources/static/docs')
}

// copyDocument (REST Docs 결과 복사)
task copyDocument(type: Copy) {
	dependsOn asciidoctor //asciidoctor 작업이 끝난 후 실행됨.
	from file("build/docs/asciidoc") // Asciidoctor가 생성한 HTML 문서를 build/docs/asciidoc에서 가져옴.
	into file("src/main/resources/static/docs") //Spring Boot 정적 리소스 디렉토리 (static/docs)로 복사.
}

//테스트 커버리지 기준을 설정. (최소 80% 이상 유지해야 함).
//		BRANCH → 코드 분기(branch) 기준 80% 이상 커버
//       LINE → 코드 라인(line) 기준 80% 이상 커버
jacocoTestCoverageVerification {
	violationRules {
		/*
        클래스 단위로 브랜치와 라인 커버리지 비율을 체크한다.
        Lombok으로 생성된 코드는 @Generated를 통해 테스트 커버리지 대상에서 제외된다.
         */
		rule {
			element = 'CLASS'

			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}

			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}

			//클래스 커버리지 측정 제외대상
			excludes = [
					'com.flab.tiple.TipleApplication',
			]
		}
	}
}

// 단순화된 QueryDSL 컴파일 태스크
task compileQuerydsl(type: JavaCompile, group: 'build') {
	// 1. 소스 설정: 메인 소스 Java 파일 지정
	source = sourceSets.main.java
	// 2. 클래스패스 설정: 컴파일에 필요한 의존성 경로 지정
	classpath = configurations.compileClasspath
	// 3. 어노테이션 프로세서 경로 설정
	options.annotationProcessorPath = configurations.annotationProcessor
	// 4. 컴파일러 옵션 설정
	options.compilerArgs = [
			"-proc:only",           // 오직 어노테이션 프로세싱만 수행
			"-processor", "com.querydsl.apt.jpa.JPAAnnotationProcessor" // QueryDSL 전용 어노테이션 프로세서 지정
	]
	// 5. 생성된 소스 파일의 출력 디렉토리 지정
	destinationDir = file(querydslDir)

	// 6. 태스크 실행 전 수행: 기존 Q타입 클래스 디렉토리 삭제 및 재생성
	doFirst {
		file(querydslDir).deleteDir()
		file(querydslDir).mkdirs()
	}
}

// 클래스 출력 디렉토리를 명확하게 설정
tasks.withType(JavaCompile) {
	options.annotationProcessorGeneratedSourcesDirectory = file(querydslDir)
}

// 추가: 클린 태스크 강화
clean {
	doFirst {
		delete querydslDir
		delete "${buildDir}"
		delete file('out')  // IDE가 생성하는 출력 디렉토리도 정리
	}
}